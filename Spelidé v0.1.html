<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#bde9ef"><title>Skogsrus</title><style>*{box-sizing:border-box}body{margin:0;background:#dff7ee;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100dvh;touch-action:manipulation}main{width:min(100vw,500px);padding:12px}header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;color:#214d3b}h1{font-size:22px;margin:0}.scores{font-size:13px;text-align:right}canvas{display:block;width:100%;aspect-ratio:3/4;border-radius:18px;box-shadow:0 12px 35px #225a3c24;touch-action:none;background:#b9e8f4}button{width:100%;border:0;background:#287d5e;color:white;border-radius:14px;padding:15px;font-size:18px;font-weight:700;margin-top:12px}p{text-align:center;color:#426d5a;font-size:13px;margin:10px}</style></head><body><main><header><h1>🌲 Skogsrus</h1><div class="scores"><div>Poäng: <strong id="score">0</strong></div><div>Rekord: <strong id="best">0</strong></div></div></header><canvas id="game" width="360" height="480" aria-label="Skogsrus endless runner"></canvas><button id="action">Starta spelet</button><p>Tryck på skärmen för att hoppa · Undvik hinder · Samla mynt</p></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),btn=document.getElementById('action'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');const W=360,H=480,ground=396;let state='ready',t=0,last=0,score=0,coins=0,speed=3.1,spawn=0,objects=[],particles=[];let best=Number(localStorage.getItem('skogsrus-best')||0);bestEl.textContent=best;const fox={x:72,y:ground-38,w:32,h:38,vy:0,onGround:true};function reset(){state='play';t=0;score=0;coins=0;speed=3.1;spawn=65;objects=[];particles=[];fox.y=ground-fox.h;fox.vy=0;fox.onGround=true;btn.textContent='Hoppa!';scoreEl.textContent='0'}function jump(){if(state!=='play'){reset();return}if(fox.onGround){fox.vy=-11.2;fox.onGround=false;for(let i=0;i<5;i++)particles.push({x:fox.x+16,y:ground,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:20})}}btn.onclick=jump;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});function hit(a,b,pad=5){return a.x+pad<b.x+b.w-pad&&a.x+a.w-pad>b.x+pad&&a.y+pad<b.y+b.h-pad&&a.y+a.h-pad>b.y+pad}function end(){state='over';btn.textContent='Spela igen';if(score>best){best=score;localStorage.setItem('skogsrus-best',best);bestEl.textContent=best}}function update(dt){if(state!=='play')return;let d=Math.min(dt,2);t+=d;speed=Math.min(7,3.1+t/650);score=Math.floor(t/7)+coins*10;scoreEl.textContent=score;fox.vy+=.58*d;fox.y+=fox.vy*d;if(fox.y>=ground-fox.h){fox.y=ground-fox.h;fox.vy=0;fox.onGround=true}spawn-=d;if(spawn<=0){let isCoin=Math.random()<.34;objects.push(isCoin?{type:'coin',x:W+20,y:ground-72-Math.random()*55,w:23,h:23}:{type:'rock',x:W+20,y:ground-29,w:29+Math.random()*10,h:29});spawn=55+Math.random()*38-Math.min(22,t/140)}for(let o of objects){o.x-=speed*d;if(hit(fox,o,o.type==='coin'?7:7)){if(o.type==='coin'){coins++;o.x=-100}else{end();break}}}objects=objects.filter(o=>o.x>-50);for(let p of particles){p.x+=p.vx*d;p.y+=p.vy*d;p.life-=d}particles=particles.filter(p=>p.life>0)}function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a4e2f6');sky.addColorStop(1,'#f0ffdb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9';for(let i=0;i<4;i++){let x=(i*125-(t*.25)%500+500)%500-50,y=60+i%2*50;ctx.beginPath();ctx.ellipse(x,y,33,12,0,0,7);ctx.ellipse(x+17,y-8,20,13,0,0,7);ctx.fill()}ctx.fillStyle='#8ccca7';for(let i=0;i<6;i++){let x=i*88-(t*.45)%88;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+36,235+(i%3)*23);ctx.lineTo(x+73,ground);ctx.fill()}ctx.fillStyle='#4c9a6d';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#35774f';ctx.fillRect(0,ground,W,8);for(let i=0;i<16;i++){let x=(i*32-t*speed*.7)%(W+40);if(x<0)x+=W+40;ctx.fillStyle='#b8e6a0';ctx.fillRect(x,ground+21+(i%3)*14,11,3)}for(let o of objects){if(o.type==='coin'){ctx.fillStyle='#ffc947';ctx.beginPath();ctx.arc(o.x+11,o.y+11,11,0,7);ctx.fill();ctx.strokeStyle='#fff3a5';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x+11,o.y+11,7,0,7);ctx.stroke()}else{ctx.fillStyle='#687e78';ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,7);ctx.fill();ctx.fillStyle='#8fa19b';ctx.fillRect(o.x+8,o.y+6,8,4)}}ctx.save();ctx.translate(fox.x,fox.y);ctx.fillStyle='#d86e35';ctx.beginPath();ctx.moveTo(5,12);ctx.lineTo(-12,0);ctx.lineTo(-9,25);ctx.closePath();ctx.fill();ctx.fillStyle='#ef9a52';ctx.beginPath();ctx.roundRect(0,6,32,31,10);ctx.fill();ctx.beginPath();ctx.moveTo(3,11);ctx.lineTo(3,-5);ctx.lineTo(15,7);ctx.moveTo(20,7);ctx.lineTo(31,-5);ctx.lineTo(30,14);ctx.fill();ctx.fillStyle='#fff4d8';ctx.beginPath();ctx.ellipse(19,24,13,10,0,0,7);ctx.fill();ctx.fillStyle='#253f38';ctx.beginPath();ctx.arc(23,14,2.5,0,7);ctx.fill();ctx.fillRect(24,26,4,3);ctx.fillStyle='#743e31';ctx.fillRect(5,35,8,4);ctx.fillRect(22,35,8,4);ctx.restore();for(let p of particles){ctx.fillStyle='#f9f1b8';ctx.fillRect(p.x,p.y,4,4)}if(state!=='play'){ctx.fillStyle='#183d32bb';ctx.fillRect(25,145,310,146);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 25px system-ui';ctx.fillText(state==='ready'?'Redo att springa?':'Oj! Du kraschade!',180,198);ctx.font='16px system-ui';ctx.fillText(state==='ready'?'Tryck för att starta':'Poäng: '+score+'  ·  Rekord: '+best,180,232);ctx.font='13px system-ui';ctx.fillText('Tryck på spelet eller knappen nedan',180,263);ctx.textAlign='left'}}function frame(now){let dt=last?(now-last)/16.667:1;last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
